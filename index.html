<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>명함</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #f2f2f4; color: #111; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
  .card { background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.10); overflow: hidden; aspect-ratio: 9 / 5; }
  .card img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-user-select: none; user-select: none; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 16px; font-size: 17px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
  .dark { background: #111; color: #fff; }
  .light { background: #fff; color: #111; border: 1.5px solid #dcdce0; }
  .btn:active { opacity: .7; }
  .msg { text-align: center; font-size: 15px; color: #6b6b72; line-height: 1.5; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card"><img id="img" alt="명함"></div>
  <p class="msg" id="err" hidden>명함을 불러오지 못했어요.<br>명함 주인에게 QR을 다시 보여 달라고 해 주세요.</p>
  <button class="btn dark" id="save" type="button" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    이미지 저장
  </button>
  <a class="btn light" id="call" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    전화 걸기
  </a>
  <p class="msg" id="hint" hidden></p>
</main>
<script>
// 명함 페이지 (11/22): QR → 이 페이지. ?c={매장}/{명함번호}&t={전화 숫자}&v={바뀐 표시}
// 이미지는 앱이 올린 명함 그림 (Supabase 공개 저장 공간 cards). 이 페이지에는 비밀 정보가 없어요.
(function () {
  var BASE = 'https://dvizbamnfhxrhdewoeja.supabase.co/storage/v1/object/public/cards/';
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || '';
  var t = (q.get('t') || '').replace(/[^0-9]/g, '');
  var v = (q.get('v') || '').replace(/[^0-9a-zA-Z]/g, '');
  var img = document.getElementById('img'), save = document.getElementById('save'), call = document.getElementById('call');
  var err = document.getElementById('err'), hint = document.getElementById('hint');
  if (!/^[0-9a-f-]{36}\/[0-9a-f-]{36}$/i.test(c)) { err.hidden = false; document.querySelector('.card').hidden = true; return; }
  var url = BASE + c + '.png' + (v ? '?v=' + v : '');
  if (t.length >= 8) { call.href = 'tel:' + t; call.hidden = false; }
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var blob = null;
  img.onerror = function () { err.hidden = false; document.querySelector('.card').hidden = true; save.hidden = true; };
  img.onload = function () { save.hidden = false; };
  img.src = url;
  // 저장 버튼을 누르자마자 쓸 수 있게 미리 받아 둠 (아이폰은 누른 순간에 바로 공유 창을 열어야 해요)
  fetch(url).then(function (r) { if (!r.ok) throw 0; return r.blob(); }).then(function (b) { blob = b; }).catch(function () {});
  function longPress() { hint.textContent = '명함 이미지를 길게 누르고 ‘사진 앱에 저장’(또는 ‘이미지 저장’)을 눌러 주세요.'; hint.hidden = false; }
  save.onclick = function () {
    if (!blob) return longPress();
    var file = new File([blob], '명함.png', { type: 'image/png' });
    // 아이폰: 공유 창 → '이미지 저장'을 누르면 사진첩에 들어가요
    if (ios && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(function (e) { if (e && e.name !== 'AbortError') longPress(); });
      return;
    }
    // 안드로이드 · 그 밖: 바로 내려받기 (갤러리에서 보여요)
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'card.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    if (ios) longPress();
  };
})();
</script>
</body>
</html>
