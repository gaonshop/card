<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가입 문의</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #f2f2f4; color: #111; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 4px 4px 0; }
  .lead { font-size: 14px; color: #6b6b72; line-height: 1.55; margin: 0 4px; }
  .card { background: #fff; border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.04); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700; }
  label small { font-weight: 500; color: #8a8a92; }
  input, textarea { font: inherit; font-size: 16px; font-weight: 500; padding: 12px 14px; border: 1px solid #dcdce0; border-radius: 14px; background: #fff; outline: none; }
  input:focus, textarea:focus { border-color: #111; }
  textarea { min-height: 90px; resize: vertical; }
  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; padding: 11px 6px; border-radius: 14px; border: 1.5px solid #dcdce0; background: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .chip.on { background: #111; color: #fff; border-color: #111; }
  .agree { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; font-weight: 600; line-height: 1.5; }
  .agree input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: #111; }
  .agree small { display: block; font-weight: 500; color: #6b6b72; }
  button.send { min-height: 54px; border: 0; border-radius: 16px; background: #111; color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .35; cursor: default; }
  .msg { color: #c62828; font-size: 14px; font-weight: 600; text-align: center; min-height: 20px; margin: 0; }
  .done { text-align: center; padding: 28px 16px; }
  .done h2 { margin: 0 0 8px; font-size: 20px; }
  .done p { margin: 0; color: #6b6b72; line-height: 1.6; font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>가입 문의</h1>
  <p class="lead">남겨 주시면 연락드려서 상담하고, 앱에서 매장을 만들 수 있는 가입 코드를 보내 드려요.</p>
  <form id="f" class="card" novalidate>
    <label>매장 이름<input name="salonName" maxlength="30" placeholder="예) ○○헤어" required></label>
    <label>대표 이름<input name="ownerName" maxlength="20" placeholder="예) 김○○" required></label>
    <label>전화번호<input name="phone" inputmode="tel" maxlength="13" placeholder="예) 010-0000-0000" required></label>
    <label>지역 <small>(선택)</small><input name="region" maxlength="30" placeholder="예) 서울 ○○구"></label>
    <div>
      <label style="margin-bottom:6px">매장 형태 <small>(선택)</small></label>
      <div class="chips"><button type="button" class="chip" data-k="single">단독 매장</button><button type="button" class="chip" data-k="multi">지점이 있는 매장</button></div>
    </div>
    <label>직원 수 <small>(선택)</small><input name="staffCount" maxlength="20" placeholder="예) 5명"></label>
    <label>지금 쓰는 프로그램 <small>(선택)</small><input name="program" maxlength="40" placeholder="예) 고객관리 프로그램 이름"></label>
    <label>알게 된 경로 <small>(선택)</small><input name="source" maxlength="40" placeholder="예) 지인 소개"></label>
    <label>궁금한 점 <small>(선택)</small><textarea name="note" maxlength="500" placeholder="자유롭게 적어 주세요"></textarea></label>
    <label class="agree"><input type="checkbox" name="agree"><span>(필수) 상담을 위한 개인정보 수집 동의<small>상담을 위해 매장 이름 · 대표 이름 · 전화번호를 받아요. 상담에만 쓰고 1년 뒤 지워요.</small></span></label>
    <p class="msg" id="msg"></p>
    <button class="send" id="send" type="submit" disabled>문의 남기기</button>
  </form>
  <div class="card done" id="done" hidden><h2>문의를 남겼어요</h2><p>적어 주신 번호로 곧 연락드릴게요.<br>상담 뒤에 가입 코드를 문자로 보내 드려요.</p></div>
</main>
<script>
// 가입 문의 (11/22): 서버 함수 'inquiry'로 보냄 → 운영 화면 '가입 문의'. 같은 번호 · 같은 곳 하루 3번까지
(function () {
  var URL_ = 'https://dvizbamnfhxrhdewoeja.supabase.co/functions/v1/inquiry';
  var KEY = 'sb_publishable_OTa1GnWFTKZcy8a1vImqVA_YM1RQcJF'; // 앱에도 들어 있는 공개 열쇠 (비밀 아님)
  var f = document.getElementById('f'), send = document.getElementById('send'), msg = document.getElementById('msg');
  var kind = null;
  document.querySelectorAll('.chip').forEach(function (c) {
    c.onclick = function () { kind = kind === c.dataset.k ? null : c.dataset.k; document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x.dataset.k === kind); }); };
  });
  var phone = f.elements.phone;
  phone.addEventListener('input', function () {
    var d = phone.value.replace(/[^0-9]/g, '').slice(0, 11);
    phone.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
  });
  function okNow() {
    return f.elements.salonName.value.trim() && f.elements.ownerName.value.trim() && /^0\d{1,2}-\d{3,4}-\d{4}$/.test(phone.value) && f.elements.agree.checked;
  }
  f.addEventListener('input', function () { send.disabled = !okNow(); msg.textContent = ''; });
  f.addEventListener('change', function () { send.disabled = !okNow(); });
  f.onsubmit = function (e) {
    e.preventDefault();
    if (!okNow()) return;
    send.disabled = true; send.textContent = '보내는 중…';
    var b = { via: 'web', kind: kind, agree: true };
    ['salonName', 'ownerName', 'phone', 'region', 'staffCount', 'program', 'source', 'note'].forEach(function (k) { b[k] = f.elements[k].value; });
    fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify(b) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) { f.hidden = true; document.getElementById('done').hidden = false; window.scrollTo(0, 0); return; }
        msg.textContent = (r.j && r.j.message) || '잠시 후 다시 시도해 주세요.';
        send.disabled = false; send.textContent = '문의 남기기';
      })
      .catch(function () { msg.textContent = '인터넷 연결을 확인해 주세요.'; send.disabled = false; send.textContent = '문의 남기기'; });
  };
})();
</script>
</body>
</html>
